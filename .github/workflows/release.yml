name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: Create config.h from example
        run: |
          cp include/config.example.h include/config.h
          # Replace placeholder keys with dummy values for build
          sed -i 's/YOUR_API_KEY_HERE/BUILD_PLACEHOLDER/' include/config.h
          sed -i 's/YOUR_FINNHUB_KEY_HERE/BUILD_PLACEHOLDER/' include/config.h
          sed -i 's/YOUR_POLYGON_KEY_HERE/BUILD_PLACEHOLDER/' include/config.h
      
      - name: Build firmware
        run: pio run
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.get_version.outputs.VERSION }}
          files: .pio/build/esp32s3/firmware.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
